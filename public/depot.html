<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depot Dashboard</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f7f8fa;
      margin: 0;
      padding: 20px;
    }
    .nav {
      text-align: right;
    }
    button {
      background: #c0392b;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
    }
    th {
      background: #2c3e50;
      color: white;
    }
  </style>
</head>
<body onload="checkAuth('Depot')">
  <div class="nav">
    <button onclick="logout()">Logout</button>
  </div>
  <h1>🏗️ Depot Dashboard</h1>
  <p>Monitor all hardware requests related to depot logistics.</p>

  <table id="requestTable">
    <thead>
      <tr>
        <th>Ticket #</th>
        <th>Branch</th>
        <th>Category</th>
        <th>Item</th>
        <th>Brand</th>
        <th>Model</th>
        <th>Status</th>
        <th>Remarks</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="js/script.js"></script>
</body>
</html>
