<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 20px;
    }
    .nav {
      text-align: right;
    }
    button {
      background: #f0e006;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    input, select {
      margin: 4px;
      padding: 6px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
    }
    th {
      background: #2c3e50;
      color: white;
    }
  </style>
</head>
<body onload="checkAuth('User')">
  <div class="nav">
    <button onclick="logout()">Logout</button>
  </div>

  <h1>👤 User Dashboard</h1>

  <form id="addRequestForm">
    <input id="ticketNo" placeholder="Ticket #" required>
    <input id="branchName" placeholder="Branch" required>
    <select id="reqCategory"></select>
    <input id="itemName" placeholder="Item Name" required>
    <input id="quantity" type="number" placeholder="Qty" required>
    <input id="requestedBy" placeholder="Requested By" required>
    <button type="submit">Submit Request</button>
  </form>

  <h2>📋 My Requests</h2>
  <table id="requestTable">
    <thead>
      <tr>
        <th>Ticket #</th>
        <th>Branch</th>
        <th>Category</th>
        <th>Item</th>
        <th>Qty</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="js/script.js"></script>
</body>
</html>
