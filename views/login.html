<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Hardware Portal - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-900 to-purple-900 min-h-screen flex items-center justify-center">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-8 w-96 shadow-2xl">
        <div class="text-center mb-8">
            <i class="fas fa-microchip text-5xl text-white mb-3"></i>
            <h1 class="text-3xl font-bold text-white">IT Hardware Portal</h1>
            <p class="text-gray-300 mt-2">Waltermart IT Hardware Portal</p>
        </div>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-white mb-2">Username</label>
                <input type="text" id="username" required class="w-full px-4 py-2 rounded-lg bg-white/20 text-white border border-white/30 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-white mb-2">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 rounded-lg bg-white/20 text-white border border-white/30 focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
                <i class="fas fa-sign-in-alt mr-2"></i>Login
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm text-gray-300 border-t border-white/20 pt-4">
            <p class="font-semibold mb-2">CREATED BY IT SOUTH 2</p>
        </div>
    </div>
    
    <div id="errorModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-sm mx-4">
            <div class="flex items-center mb-4">
                <i class="fas fa-exclamation-triangle text-red-500 text-2xl mr-3"></i>
                <h3 class="text-lg font-bold text-gray-800">Login Failed</h3>
            </div>
            <p id="errorMessage" class="text-gray-700 mb-4"></p>
            <button onclick="closeModal()" class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">OK</button>
        </div>
    </div>
    
    <script>
        const loginForm = document.getElementById('loginForm');
        const errorModal = document.getElementById('errorModal');
        const errorMessage = document.getElementById('errorMessage');
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            const data = await response.json();
            
            if (data.success) {
                window.location.href = '/dashboard';
            } else {
                errorMessage.textContent = data.message;
                errorModal.classList.remove('hidden');
            }
        });
        
        function closeModal() {
            errorModal.classList.add('hidden');
        }
    </script>
</body>
</html>
